services:
  grader-backend:
    depends_on:
      - grader-postgres
      - grader-rabbitmq
    build:
      context: .
      dockerfile: Dockerfile.backend.yaml
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    working_dir: /app
    command: ./mvnw spring-boot:run
    env_file:
      - .env

  grader-postgres:
    image: postgres:16.15-alpine3.24
    volumes:
      - grader-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: grader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"

  grader-pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - "5050:80"
    volumes:
      - grader-pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
  
  grader-rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    
  grader-worker:
    build:
      context: ./grader-worker
      dockerfile: Dockerfile.grader-worker.yaml
    depends_on:
      - grader-postgres
      - grader-rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://grader-postgres:5432/grader
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: grader-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    volumes:
      - ./grader-worker:/app

volumes:
  grader-postgres-data:
  grader-pgadmin-data:
  maven-cache: